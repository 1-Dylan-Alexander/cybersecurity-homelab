name: Documentation integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown-links:
    name: Validate local Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check local links without external dependencies
        run: python3 scripts/check_markdown_links.py
